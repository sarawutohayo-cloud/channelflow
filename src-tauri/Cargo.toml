[package]
name = "channel-flow"
version = "0.1.0"
description = "Multi-channel YouTube publishing desktop app"
edition = "2021"

[lib]
name = "channel_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
